name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # Keep only the newest run for each branch. A newer push cancels the
  # superseded gate run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install app dependencies
        run: npm ci
      - name: Typecheck app
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install dashboard dependencies
        run: npm ci --prefix web
      - name: Build dashboard
        run: npm run build --prefix web
